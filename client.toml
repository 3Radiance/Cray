role = "client"

[[inbound.layers]]
type = "tcp"
addr = "127.0.0.1:10810"

[[inbound.layers]]
type = "http_connect"

[[outbound.layers]]
type = "tcp"
addr = "127.0.0.1:10811"

[[outbound.layers]]
type = "tls"
sni = "domain.com"

[[outbound.layers]]
type = "http2"
path = "/tun"
host = "idk.com"
method = "POST"

[[outbound.layers]]
type = "tsf"
magic = 432


[tls]
cipher_suites = [
    "TLS_AES_128_GCM_SHA256",
    "TLS_AES_256_GCM_SHA384",
    "TLS_CHACHA20_POLY1305_SHA256",
    "ECDHE-ECDSA-AES128-GCM-SHA256",
    "ECDHE-ECDSA-AES256-GCM-SHA384",
    "ECDHE-RSA-AES128-GCM-SHA256",
    "ECDHE-RSA-AES256-GCM-SHA384",
]

alpn = ["h2"]
curves = ["X25519", "P-256", "P-384"]
signature_algorithms = [
    "rsa_pkcs1_md5_sha1",
    "rsa_pkcs1_sha1",
    "rsa_pkcs1_sha256",
    "rsa_pkcs1_sha256_legacy",
    "rsa_pkcs1_sha384",
    "rsa_pkcs1_sha512",
    "ecdsa_secp256r1_sha256"
]
permute_extensions = true

[http2]

[http2.settings]
header_table_size = 65535
enable_push = false
max_concurrent_streams = 100
initial_window_size = 65535
max_frame_size = 16384

settings_order = [
    "enable_push",
    "header_table_size",
    "max_concurrent_streams",
    "initial_window_size",
    "max_frame_size",
]