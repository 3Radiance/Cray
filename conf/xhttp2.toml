settings_order = [
    "enable_push",
    "header_table_size",
    "max_concurrent_streams",
    "initial_window_size",
    "max_frame_size",
]

[settings]
header_table_size = 65535
enable_push = false
max_concurrent_streams = 100
initial_window_size = 65535
max_frame_size = 16384

[http_headers]
"x-session-id" = "id"

# "id" is required on both legs; "seq" is required on the uplink in PacketUp mode.
# Do not put content-type = "application/grpc" on the downlink (GET).
[uplink.http_headers]
"x-session-id" = "id"
"x-seq" = "seq"

# Keep the tunnel GET out of CDN caches and unbuffered.
[downlink.response.http_headers]
"cache-control" = "no-store"
"content-type" = "text/event-stream"
"x-accel-buffering" = "no"
