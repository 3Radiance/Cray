role = "client"

[[inbound.layers]]
type = "tcp"
addr = "127.0.0.1:10810"

[[inbound.layers]]
type = "http-proxy"

[[outbound.layers]]
type = "tcp"
addr = "127.0.0.1:10811"

[[outbound.layers]]
type = "tls"
sni = "idk.com"
tls_path = "./tls.toml"
http2_path = "./http2.toml" # if alps = true else set stub http2_path  = "/"

[[outbound.layers]]
type = "http2"
path = "/tun"
host = "idk.com"
method = "POST"
config = "./http2.toml"

[[outbound.layers]]
type = "vless"
uuid = "11111111-1111-4111-8111-111111111111"
