[[inbound.layers]]
type = "tcp"
addr = "127.0.0.1:10811"

[[inbound.layers]]
type = "tls"
certs = [
    { sni = "up.example.com",   cert = "/path/to/up.pem",   key = "/path/to/up.key" },
    { sni = "down.example.com", cert = "/path/to/down.pem", key = "/path/to/down.key" },
]
default = "up.example.com"
alpn = ["h2"]

[[inbound.layers]]
type = "http2"
path = "/tun"
host = "idk.com"
method = "POST"

[[inbound.layers]]
type = "vless"
uuid = "11111111-1111-4111-8111-111111111111"

[[outbound.layers]]
type = "tcp"                 # direct
