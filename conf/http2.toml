[settings]
header_table_size = 65535
enable_push = false
max_concurrent_streams = 100
initial_window_size = 65535
max_frame_size = 16384

settings_order = [
    "enable_push",
    "header_table_size",
    "max_concurrent_streams",
    "initial_window_size",
    "max_frame_size",
]

[http_headers]
"x-session-id" = "id"
