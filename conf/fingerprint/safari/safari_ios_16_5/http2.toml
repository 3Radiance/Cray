# wreq-util emulation profile: safari/safari_ios_16_5
# UA by OS ('*' = default/first):
#   macos    Mozilla/5.0 (iPhone; CPU iPhone OS 16_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.5 Mobile/15E148 Safari/604.1

settings_order = [
    "initial_window_size",
    "max_concurrent_streams",
    "enable_connect_protocol",
    "no_rfc7540_priorities",
]
connection_window_update = 10485760
pseudo_headers_order = [
    ":method",
    ":scheme",
    ":path",
    ":authority",
]
headers_order = [
    "accept",
    "sec-fetch-site",
    "accept-encoding",
    "sec-fetch-mode",
    "user-agent",
    "accept-language",
    "sec-fetch-dest",
]
[http_headers]
accept = "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
sec-fetch-site = "none"
accept-encoding = "gzip, deflate, br"
sec-fetch-mode = "navigate"
user-agent = "Mozilla/5.0 (iPhone; CPU iPhone OS 16_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.5 Mobile/15E148 Safari/604.1"
accept-language = "en-US,en;q=0.9"
sec-fetch-dest = "document"
[settings]
enable_push = true
max_concurrent_streams = 100
initial_window_size = 2097152
# NOTE: wreq: enable_push не задан (не шлётся); тут включён формально — не в settings_order
