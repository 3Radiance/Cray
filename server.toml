role = "server"

[[inbound.layers]]
type = "tcp"
addr = "127.0.0.1:10811"

[[inbound.layers]]
type = "tls"
cert = "/path/to"
key = "/path/to"
tls_path = "./tls.toml" # Used only for ALPN negotiation

[[inbound.layers]]
type = "http2"
path = "/tun"
host = "idk.com"
method = "POST"

[[inbound.layers]]
type = "tsf"
magic = 432

[[outbound.layers]]
type = "tcp"                 # direct
