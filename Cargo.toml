[workspace]
resolver = "3"
members = ["core", "layers", "cray"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter","chrono"] }
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.8", features = ["v4"] }
rand = "0.9"
hex = "0.4"
fastrand = "2.5.0"
httparse = "1.8"
bytes = "1.12.1"
http = "1.5.0"
http2 = { version = "0.5.2", features = ["unstable"] }
btls = "0.5.6"
btls-sys = "0.5.6"
tokio-btls = "0.5"
chromium-roots = "0.1.1"
brotli = "9"
flate2 = "1"
zstd = "0.14"
foreign-types-shared = "0.3"
dashmap = "6.2.1"

cray-core = { path = "core" }
cray-layers = { path = "layers" }