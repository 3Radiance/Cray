[package]
name = "cray"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-btls = "0.5"
btls = "0.5.6"
anyhow = "1.0"
httparse = "1.8"
bytes = "1.12.1"
http2 = { version = "0.5.2", features = ["unstable"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
http = "1.5.0"
chromium-roots = "0.1.1"
brotli = "9"
flate2 = "1"
zstd = "0.14"
btls-sys = "0.5.6"
foreign-types-shared = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
clap = { version = "4.5", features = ["derive"] }
